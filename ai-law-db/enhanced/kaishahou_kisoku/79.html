<p>1 取締役が会計参与の解任に関する議案を提出する場合には、株主総会参考書類には、次に掲げる事項を記載しなければならない。</p>

<p class="item" data-item="二" data-item-index="2" id="p1-i2" data-cite="会社法施行規則第79条第1項第2号" data-cite-id="kaishahou_kisoku:79:p1:i2">二 解任の理由</p>
<p class="item" data-item="三" data-item-index="3" id="p1-i3" data-cite="会社法施行規則第79条第1項第3号" data-cite-id="kaishahou_kisoku:79:p1:i3">三 法第三百四十五条第一項の規定による会計参与の意見があるときは、その意見の内容の概要</p>
