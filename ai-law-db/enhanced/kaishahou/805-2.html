<h1>会社法</h1>
<h2 id="article-805-2">第八百五条の二（新設合併等をやめることの請求）</h2>
<p>
law_code: <code>kaishahou</code> / article: <code>805-2</code> / cite: <code>会社法第805条の2</code> / as_of: <code>2025-12-27</code><br>
<a href="index.html">目次</a> / <a href="805.html">前条</a> / <a href="806.html">次条</a> / <a href="../../text/kaishahou/805-2.txt">text</a> / related: <a href="../kaishahou_seirei/index.html">施行令</a> , <a href="../kaishahou_kisoku/index.html">施行規則</a>
</p>
<div data-paragraph="1" id="p1" data-cite="会社法第805条の2第1項" data-cite-id="kaishahou:805-2:p1">
<p>1 新設合併等が法令又は定款に違反する場合において、消滅株式会社等の株主が不利益を受けるおそれがあるときは、消滅株式会社等の株主は、消滅株式会社等に対し、当該新設合併等をやめることを請求することができる。 ただし、前条に規定する場合は、この限りでない。</p>
</div>
