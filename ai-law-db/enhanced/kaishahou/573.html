<h1>会社法</h1>
<h2 id="article-573">第五百七十三条（特別清算終結の決定）</h2>
<p>
law_code: <code>kaishahou</code> / article: <code>573</code> / cite: <code>会社法第573条</code> / as_of: <code>2025-12-27</code><br>
<a href="index.html">目次</a> / <a href="572.html">前条</a> / <a href="574.html">次条</a> / <a href="../../text/kaishahou/573.txt">text</a> / related: <a href="../kaishahou_seirei/index.html">施行令</a> , <a href="../kaishahou_kisoku/index.html">施行規則</a>
</p>
<div data-paragraph="1" id="p1" data-cite="会社法第573条第1項" data-cite-id="kaishahou:573:p1">
<p>1 裁判所は、特別清算開始後、次に掲げる場合には、清算人、監査役、債権者、株主又は調査委員の申立てにより、特別清算終結の決定をする。</p>
<p class="item" data-item="一" data-item-index="1" id="p1-i1" data-cite="会社法第573条第1項第1号" data-cite-id="kaishahou:573:p1:i1">一 特別清算が結了したとき。</p>
<p class="item" data-item="二" data-item-index="2" id="p1-i2" data-cite="会社法第573条第1項第2号" data-cite-id="kaishahou:573:p1:i2">二 特別清算の必要がなくなったとき。</p>
</div>
