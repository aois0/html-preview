<h1>会社法</h1>
<h2 id="article-50">第五十条（株式の引受人の権利）</h2>
<p>
law_code: <code>kaishahou</code> / article: <code>50</code> / cite: <code>会社法第50条</code> / as_of: <code>2025-12-27</code><br>
<a href="index.html">目次</a> / <a href="49.html">前条</a> / <a href="51.html">次条</a> / <a href="../../text/kaishahou/50.txt">text</a> / related: <a href="../kaishahou_seirei/index.html">施行令</a> , <a href="../kaishahou_kisoku/index.html">施行規則</a>
</p>
<div data-paragraph="1" id="p1" data-cite="会社法第50条第1項" data-cite-id="kaishahou:50:p1">
<p>1 発起人は、株式会社の成立の時に、出資の履行をした設立時発行株式の株主となる。</p>
</div>
<div data-paragraph="2" id="p2" data-cite="会社法第50条第2項" data-cite-id="kaishahou:50:p2">
<p>2 前項の規定により株主となる権利の譲渡は、成立後の株式会社に対抗することができない。</p>
</div>
