<h1>会社法</h1>
<h2 id="article-846">第八百四十六条（原告が敗訴した場合の損害賠償責任）</h2>
<p>
law_code: <code>kaishahou</code> / article: <code>846</code> / cite: <code>会社法第846条</code> / as_of: <code>2025-12-27</code><br>
<a href="index.html">目次</a> / <a href="845.html">前条</a> / <a href="846-2.html">次条</a> / <a href="../../text/kaishahou/846.txt">text</a> / related: <a href="../kaishahou_seirei/index.html">施行令</a> , <a href="../kaishahou_kisoku/index.html">施行規則</a>
</p>
<div data-paragraph="1" id="p1" data-cite="会社法第846条第1項" data-cite-id="kaishahou:846:p1">
<p>1 会社の組織に関する訴えを提起した原告が敗訴した場合において、原告に悪意又は重大な過失があったときは、原告は、被告に対し、連帯して損害を賠償する責任を負う。</p>
