<h1>会社法</h1>
<h2 id="article-430">第四百三十条（役員等の連帯責任）</h2>
<p>
law_code: <code>kaishahou</code> / article: <code>430</code> / cite: <code>会社法第430条</code> / as_of: <code>2025-12-27</code><br>
<a href="index.html">目次</a> / <a href="429.html">前条</a> / <a href="430-2.html">次条</a> / <a href="../../text/kaishahou/430.txt">text</a> / related: <a href="../kaishahou_seirei/index.html">施行令</a> , <a href="../kaishahou_kisoku/index.html">施行規則</a>
</p>
<div data-paragraph="1" id="p1" data-cite="会社法第430条第1項" data-cite-id="kaishahou:430:p1">
<p>1 役員等が株式会社又は第三者に生じた損害を賠償する責任を負う場合において、他の役員等も当該損害を賠償する責任を負うときは、これらの者は、連帯債務者とする。</p>
</div>
