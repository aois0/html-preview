<h1>会社法</h1>
<h2 id="article-531">第五百三十一条（監督委員の注意義務）</h2>
<p>
law_code: <code>kaishahou</code> / article: <code>531</code> / cite: <code>会社法第531条</code> / as_of: <code>2025-12-27</code><br>
<a href="index.html">目次</a> / <a href="530.html">前条</a> / <a href="532.html">次条</a> / <a href="../../text/kaishahou/531.txt">text</a> / related: <a href="../kaishahou_seirei/index.html">施行令</a> , <a href="../kaishahou_kisoku/index.html">施行規則</a>
</p>
<div data-paragraph="1" id="p1" data-cite="会社法第531条第1項" data-cite-id="kaishahou:531:p1">
<p>1 監督委員は、善良な管理者の注意をもって、その職務を行わなければならない。</p>
</div>
<div data-paragraph="2" id="p2" data-cite="会社法第531条第2項" data-cite-id="kaishahou:531:p2">
<p>2 監督委員が前項の注意を怠ったときは、その監督委員は、利害関係人に対し、連帯して損害を賠償する責任を負う。</p>
</div>
