<h1>会社法</h1>
<h2 id="article-136">第百三十六条（株主からの承認の請求）</h2>
<p>
law_code: <code>kaishahou</code> / article: <code>136</code> / cite: <code>会社法第136条</code> / as_of: <code>2025-12-27</code><br>
<a href="index.html">目次</a> / <a href="135.html">前条</a> / <a href="137.html">次条</a> / <a href="../../text/kaishahou/136.txt">text</a> / related: <a href="../kaishahou_seirei/index.html">施行令</a> , <a href="../kaishahou_kisoku/index.html">施行規則</a>
</p>
<div data-paragraph="1" id="p1" data-cite="会社法第136条第1項" data-cite-id="kaishahou:136:p1">
<p>1 譲渡制限株式の株主は、その有する譲渡制限株式を他人（当該譲渡制限株式を発行した株式会社を除く。）に譲り渡そうとするときは、当該株式会社に対し、当該他人が当該譲渡制限株式を取得することについて承認をするか否かの決定をすることを請求することができる。</p>
</div>
