<h1>会社法</h1>
<h2 id="article-171-3">第百七十一条の三（全部取得条項付種類株式の取得をやめることの請求）</h2>
<p>
law_code: <code>kaishahou</code> / article: <code>171-3</code> / cite: <code>会社法第171条の3</code> / as_of: <code>2025-12-27</code><br>

</p>
<div data-paragraph="1" id="p1" data-cite="会社法第171条の3第1項" data-cite-id="kaishahou:171-3:p1">
<p>1 第百七十一条第一項の規定による全部取得条項付種類株式の取得が法令又は定款に違反する場合において、株主が不利益を受けるおそれがあるときは、株主は、株式会社に対し、当該全部取得条項付種類株式の取得をやめることを請求することができる。</p>
