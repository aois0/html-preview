<!-- Shared style snippet: copy into each card (static pages, no build step required). -->
<style>
  :root{--bg:#ffffff;--text:#1b1b1b;--muted:#666;--accent:#b04a2f;--border:#e7e0d8;--code:#f5f2ed;}
  body{margin:0;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;color:var(--text);background:var(--bg);line-height:1.75;}
  header{padding:18px 18px 14px;border-bottom:1px solid var(--border);background:linear-gradient(135deg,#f6efe4,#fff);}
  header h1{margin:0 0 6px 0;font-size:18px;}
  header .meta{color:var(--muted);font-size:13px;}
  main{max-width:980px;margin:0 auto;padding:18px;}
  section{border:1px solid var(--border);border-radius:12px;padding:14px 16px;margin:14px 0;}
  h2{margin:0 0 8px 0;font-size:15px;color:var(--accent);}
  p{margin:8px 0;}
  ul{padding-left:20px;margin:8px 0;}
  code,pre{background:var(--code);border:1px solid #eee2d7;border-radius:8px;}
  code{padding:0 6px;}
  pre{padding:10px 12px;overflow:auto;font-size:13px;white-space:pre-wrap;}
  .tldr{font-weight:600;}
  .small{color:var(--muted);font-size:13px;}
  .k{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;}
</style>
