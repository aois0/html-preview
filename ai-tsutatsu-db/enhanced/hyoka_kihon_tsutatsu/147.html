<h2 id="item-147">147（商標権及びその使用権の評価）</h2>
<p>
doc_code: <code>hyoka_kihon_tsutatsu</code> / item: <code>147</code> / snapshot: <code>2026-02-07</code><br><a href="index.html">目次</a> / <a href="../../text/hyoka_kihon_tsutatsu/147.txt">text</a> / <a href="https://www.nta.go.jp/law/tsutatsu/kihon/sisan/hyoka_new/07/01.htm">source</a>

<div data-paragraph="1" id="p1" data-cite="財産評価基本通達147" data-cite-id="hyoka_kihon_tsutatsu:147:p1">
<p>商標権及びその使用権の価額は、140≪特許権の評価≫から145≪権利者が自ら特許発明を実施している場合の特許権及び実施権の評価≫の定めを準用して評価する。</p>
</div>
<div data-paragraph="2" id="p2" data-cite="財産評価基本通達147" data-cite-id="hyoka_kihon_tsutatsu:147:p2">
<p>第4節 著作権、出版権及び著作隣接権</p>
