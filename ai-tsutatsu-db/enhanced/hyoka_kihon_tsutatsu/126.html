<h1>財産評価基本通達</h1>
<h2 id="item-126">126（分収林契約に係る造林者の有する立木の評価）</h2>
<p>
doc_code: <code>hyoka_kihon_tsutatsu</code> / item: <code>126</code> / snapshot: <code>2026-02-07</code><br><a href="index.html">目次</a> / <a href="../../text/hyoka_kihon_tsutatsu/126.txt">text</a> / <a href="https://www.nta.go.jp/law/tsutatsu/kihon/sisan/hyoka_new/05/05.htm">source</a>
</p>
<div data-paragraph="1" id="p1" data-cite="財産評価基本通達126" data-cite-id="hyoka_kihon_tsutatsu:126:p1">
<p>分収林契約でその造林に係る立木の全部を造林を行った者（その者が2人以上ある場合には、それらのすべての者）が所有する旨の約されているものに係る立木の価額は、113≪森林の主要樹種の立木の評価≫又は123≪保安林等の立木の評価≫の定めにより評価したその立木の価額に、その造林を行った者の分収割合を乗じて計算した価額によって評価する。（平3課評2−4外改正）</p>
</div>
