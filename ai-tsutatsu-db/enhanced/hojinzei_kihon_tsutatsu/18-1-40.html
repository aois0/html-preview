<h1>法人税基本通達</h1>
<h2 id="item-18-1-40">18−1−40（恒久的施設等の個別財務諸表が作成されることとなる場合の準用）</h2>
<p>
doc_code: <code>hojinzei_kihon_tsutatsu</code> / item: <code>18-1-40</code> / snapshot: <code>2025-06-28</code><br><a href="index.html">目次</a> / <a href="../../text/hojinzei_kihon_tsutatsu/18-1-40.txt">text</a> / <a href="https://www.nta.go.jp/law/tsutatsu/kihon/hojin/18/18_01_08.htm">source</a>
</p>
<div data-paragraph="1" id="p1" data-cite="法人税基本通達18−1−40" data-cite-id="hojinzei_kihon_tsutatsu:18-1-40:p1">
<p>20−2−1《恒久的施設帰属所得の認識に当たり勘案されるその他の状況》から20−2−4《恒久的施設において使用する資産の範囲》までの取扱いは、令第155条の16第11項第3号《当期純損益金額》の「作成されることとなる個別財務諸表」の財産及び損益を認識する場合について準用する。（令5年課法2−17｢九」により追加）</p>
