<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>サンリオCFC事件 総合インフォグラフィック</title>
<style>
  body { margin: 0; background: #0f1923; display: flex; justify-content: center; padding: 20px; }
  svg { max-width: 100%; height: auto; display: block; }
</style>
</head>
<body>
<svg viewBox="0 0 1000 2640" xmlns="http://www.w3.org/2000/svg" style="width:1000px;max-width:100%">
  <defs>
    <!-- Arrow markers -->
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a90d9"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arr-white" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <marker id="arr-gold" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f1c40f"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#95a5a6"/>
    </marker>
    <!-- Drop shadow filter -->
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="2" dy="2" stdDeviation="3" flood-color="#00000040"/>
    </filter>
    <filter id="shadow-sm" x="-3%" y="-3%" width="106%" height="106%">
      <feDropShadow dx="1" dy="1" stdDeviation="2" flood-color="#00000030"/>
    </filter>
    <!-- Glow filter -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Gradient backgrounds -->
    <linearGradient id="grad-navy" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0f2544"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
    <linearGradient id="grad-header" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1628"/>
      <stop offset="50%" style="stop-color:#1a3a5c"/>
      <stop offset="100%" style="stop-color:#2c4f7c"/>
    </linearGradient>
    <linearGradient id="grad-red" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#922b21"/>
      <stop offset="100%" style="stop-color:#c0392b"/>
    </linearGradient>
    <linearGradient id="grad-blue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a5276"/>
      <stop offset="100%" style="stop-color:#2980b9"/>
    </linearGradient>
    <linearGradient id="grad-purple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#5b2c6f"/>
      <stop offset="100%" style="stop-color:#8e44ad"/>
    </linearGradient>
    <linearGradient id="grad-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1c2833"/>
      <stop offset="100%" style="stop-color:#212f3d"/>
    </linearGradient>
    <linearGradient id="grad-section" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#1a3a5c"/>
      <stop offset="60%" style="stop-color:#2471a3"/>
      <stop offset="100%" style="stop-color:#1a3a5c"/>
    </linearGradient>
  </defs>

  <!-- =============================================
       BACKGROUND
       ============================================= -->
  <rect width="1000" height="2640" fill="#0f1923"/>
  <!-- Subtle grid texture -->
  <pattern id="grid" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40,0 L0,0 0,40" fill="none" stroke="#ffffff06" stroke-width="1"/>
  </pattern>
  <rect width="1000" height="2640" fill="url(#grid)"/>

  <!-- =============================================
       SECTION 1: HEADER
       ============================================= -->
  <rect x="0" y="0" width="1000" height="110" fill="url(#grad-header)"/>
  <!-- Accent line -->
  <rect x="0" y="107" width="1000" height="3" fill="url(#grad-red)"/>
  <!-- Decorative left accent -->
  <rect x="0" y="0" width="6" height="110" fill="#c0392b"/>

  <text x="30" y="38" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#93c5fd" letter-spacing="3">CASE ANALYSIS</text>
  <text x="30" y="68" font-family="'Noto Sans JP', sans-serif" font-size="22" font-weight="bold" fill="white">サンリオCFC判決 — 外税控除当初申告要件との構造的対比</text>
  <text x="30" y="92" font-family="'Noto Sans JP', sans-serif" font-size="12" fill="#94a3b8">東京地裁 令和3年2月26日 / 東京高裁 令和3年11月24日 | 税務訴訟資料第271号-29・131 全文分析</text>
  <!-- Right badge -->
  <rect x="820" y="18" width="160" height="74" rx="8" fill="#ffffff0f" stroke="#ffffff20" stroke-width="1"/>
  <text x="900" y="40" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#94a3b8" text-anchor="middle">判決全文確認済</text>
  <text x="900" y="57" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="bold">順号13531</text>
  <text x="900" y="73" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="bold">順号13633</text>

  <!-- =============================================
       SECTION 2: 事件概要ファクト
       ============================================= -->
  <!-- Section Label -->
  <rect x="30" y="126" width="200" height="24" rx="4" fill="url(#grad-blue)"/>
  <text x="42" y="143" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="white">01  事件の基本事実</text>

  <!-- 4 fact cards in 2x2 -->
  <!-- Card 1: 当事者 -->
  <rect x="30" y="158" width="220" height="120" rx="8" fill="#1c2d42" stroke="#2c4f7c" stroke-width="1" filter="url(#shadow-sm)"/>
  <rect x="30" y="158" width="220" height="28" rx="8" fill="url(#grad-blue)"/>
  <rect x="30" y="178" width="220" height="8" rx="0" fill="url(#grad-blue)"/>
  <text x="140" y="177" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">当事者</text>
  <text x="45" y="207" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#93c5fd" font-weight="bold">原告（納税者）</text>
  <text x="45" y="222" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#e2e8f0">株式会社 A（サンリオ）</text>
  <text x="45" y="237" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#64748b">品川税務署長 管轄</text>
  <text x="45" y="256" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#f87171" font-weight="bold">被告</text>
  <text x="45" y="270" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#e2e8f0">国（東京国税局）</text>

  <!-- Card 2: 課税額 -->
  <rect x="268" y="158" width="220" height="120" rx="8" fill="#1c2d42" stroke="#2c4f7c" stroke-width="1" filter="url(#shadow-sm)"/>
  <rect x="268" y="158" width="220" height="28" rx="8" fill="url(#grad-red)"/>
  <rect x="268" y="178" width="220" height="8" rx="0" fill="url(#grad-red)"/>
  <text x="378" y="177" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">課税額</text>
  <text x="283" y="207" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#fca5a5">旧事件（本件）追徴</text>
  <text x="283" y="226" font-family="'Noto Sans JP', sans-serif" font-size="20" font-weight="bold" fill="#f87171">約11億円</text>
  <text x="283" y="243" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#94a3b8">所得約28億円 / H25〜H28年度</text>
  <text x="283" y="260" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#64748b">新事件（2023提訴）は約13億円</text>
  <text x="283" y="275" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#64748b">（所得約42億円 / 5年間）</text>

  <!-- Card 3: 対象子会社 -->
  <rect x="506" y="158" width="220" height="120" rx="8" fill="#1c2d42" stroke="#2c4f7c" stroke-width="1" filter="url(#shadow-sm)"/>
  <rect x="506" y="158" width="220" height="28" rx="8" fill="url(#grad-navy)"/>
  <rect x="506" y="178" width="220" height="8" rx="0" fill="url(#grad-navy)"/>
  <text x="616" y="177" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">対象子会社</text>
  <text x="521" y="207" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#93c5fd" font-weight="bold">B社（香港）</text>
  <text x="521" y="222" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#e2e8f0">法人税率 16.5%  → 20%未満</text>
  <text x="521" y="237" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#e2e8f0">キャラクターライセンス事業</text>
  <text x="521" y="257" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#93c5fd" font-weight="bold">C社（香港）</text>
  <text x="521" y="272" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#e2e8f0">同上・キャラクタービジネス</text>

  <!-- Card 4: 裁判経過 -->
  <rect x="744" y="158" width="220" height="120" rx="8" fill="#1c2d42" stroke="#2c4f7c" stroke-width="1" filter="url(#shadow-sm)"/>
  <rect x="744" y="158" width="220" height="28" rx="8" fill="url(#grad-purple)"/>
  <rect x="744" y="178" width="220" height="8" rx="0" fill="url(#grad-purple)"/>
  <text x="854" y="177" font-family="'Noto Sans JP', sans-serif" font-size="10" font-weight="bold" fill="white" text-anchor="middle">裁判経過</text>
  <text x="759" y="205" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#d8b4fe">H29.12 課税処分（品川税務署長）</text>
  <text x="759" y="222" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#fca5a5">R3.2.26  東京地裁 →  棄却</text>
  <text x="759" y="239" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#fca5a5">R3.11.24 東京高裁 →  棄却</text>
  <text x="759" y="256" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#f1c40f">最高裁へ上告（「到底承服できない」）</text>
  <text x="759" y="273" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#94a3b8">裁判長：鎌野真敬（地裁）</text>

  <!-- =============================================
       SECTION 3: 5争点の論理連鎖
       ============================================= -->
  <rect x="30" y="302" width="200" height="24" rx="4" fill="url(#grad-section)"/>
  <text x="42" y="319" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="white">02  5つの争点と裁判所の判断</text>

  <!-- Flow: 5 dispute points -->
  <!-- Point 1 -->
  <rect x="30" y="340" width="940" height="52" rx="7" fill="#1e2d3d" stroke="#334155" stroke-width="1"/>
  <rect x="30" y="340" width="7" height="52" rx="3" fill="#64748b"/>
  <text x="50" y="362" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#94a3b8" font-weight="bold">争点１</text>
  <text x="50" y="380" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#64748b">連結利益積立金額等のお知らせは行政処分か</text>
  <!-- Result badge -->
  <rect x="780" y="351" width="170" height="26" rx="5" fill="#374151"/>
  <text x="865" y="369" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">行政処分でない → 訴え却下</text>

  <!-- Arrow down -->
  <line x1="500" y1="392" x2="500" y2="408" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Point 2 -->
  <rect x="30" y="412" width="940" height="52" rx="7" fill="#1e2d3d" stroke="#334155" stroke-width="1"/>
  <rect x="30" y="412" width="7" height="52" rx="3" fill="#64748b"/>
  <text x="50" y="434" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#94a3b8" font-weight="bold">争点２</text>
  <text x="50" y="452" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#64748b">本件各香港子会社は特定外国子会社等（タックスヘイブン居住会社）に該当するか</text>
  <rect x="780" y="423" width="170" height="26" rx="5" fill="#374151"/>
  <text x="865" y="441" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#64748b" text-anchor="middle">判断省略（後の争点で棄却）</text>

  <line x1="500" y1="464" x2="500" y2="480" stroke="#334155" stroke-width="1.5" marker-end="url(#arr-gray)"/>

  <!-- Point 3 - KEY -->
  <rect x="30" y="484" width="940" height="66" rx="7" fill="#2d1515" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="30" y="484" width="7" height="66" rx="3" fill="#c0392b"/>
  <!-- Star marker -->
  <text x="44" y="516" font-family="sans-serif" font-size="14" fill="#f1c40f">★</text>
  <text x="64" y="504" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#fca5a5" font-weight="bold">争点３  〔核心①〕</text>
  <text x="64" y="521" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#fde8e8">適用除外記載書面を確定申告書に添付していなくても、適用除外規定を受けられるか</text>
  <text x="64" y="540" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#fca5a5">→ 措法66条の6第７項は適用要件（効力要件）であり、書面不添付 ＝ 適用除外の権利消滅</text>
  <!-- Result -->
  <rect x="780" y="493" width="170" height="46" rx="5" fill="#7f1d1d"/>
  <text x="865" y="511" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle" font-weight="bold">適用除外：認めず</text>
  <text x="865" y="527" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">地裁・高裁とも</text>

  <line x1="500" y1="550" x2="500" y2="566" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Point 4 -->
  <rect x="30" y="570" width="940" height="66" rx="7" fill="#1e1a2e" stroke="#8e44ad" stroke-width="1.5"/>
  <rect x="30" y="570" width="7" height="66" rx="3" fill="#8e44ad"/>
  <text x="44" y="592" font-family="sans-serif" font-size="14" fill="#d8b4fe">⚖</text>
  <text x="64" y="590" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#d8b4fe" font-weight="bold">争点４  〔理由の差替え〕</text>
  <text x="64" y="607" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#f0e6ff">書面不添付を理由とする主張の追加は、違法な「理由の差替え」として許されないか</text>
  <text x="64" y="626" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#d8b4fe">→ 処分適正化機能・争点明確化機能の観点から、追加は許される。差替えには当たらない</text>
  <rect x="780" y="579" width="170" height="46" rx="5" fill="#4a235a"/>
  <text x="865" y="597" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#d8b4fe" text-anchor="middle" font-weight="bold">差替え：許容</text>
  <text x="865" y="613" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#d8b4fe" text-anchor="middle">地裁・高裁とも</text>

  <line x1="500" y1="636" x2="500" y2="652" stroke="#c0392b" stroke-width="2" marker-end="url(#arr-red)"/>

  <!-- Point 5 - KEY -->
  <rect x="30" y="656" width="940" height="80" rx="7" fill="#2d1515" stroke="#c0392b" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="30" y="656" width="7" height="80" rx="3" fill="#c0392b"/>
  <text x="44" y="698" font-family="sans-serif" font-size="14" fill="#f1c40f">★</text>
  <text x="64" y="676" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#fca5a5" font-weight="bold">争点５  〔核心②〕  予備的主張</text>
  <text x="64" y="694" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="#fde8e8">仮にCFC課税が適用されるとしても、外国税額控除（法人税法69条15項）は適用されるか</text>
  <text x="64" y="712" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#fca5a5">→ 法人税法69条15項も適用要件（当初申告要件型）。明細書未添付 ＝ 外税控除の権利消滅</text>
  <text x="64" y="727" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#fca5a5">→ 「特別の事情」後段も：控除限度額の増額再計算のみ。外国法人税の範囲拡大は不可</text>
  <rect x="780" y="665" width="170" height="60" rx="5" fill="#7f1d1d"/>
  <text x="865" y="686" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#fca5a5" text-anchor="middle" font-weight="bold">外税控除：認めず</text>
  <text x="865" y="702" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">地裁・高裁とも</text>
  <text x="865" y="718" font-family="'Noto Sans JP', sans-serif" font-size="9" fill="#fca5a5" text-anchor="middle">最高裁へ上告</text>

  <!-- Result box -->
  <rect x="30" y="754" width="940" height="40" rx="7" fill="#7f1d1d" filter="url(#shadow)"/>
  <text x="500" y="779" font-family="'Noto Sans JP', sans-serif" font-size="13" font-weight="bold" fill="white" text-anchor="middle">
    ▶ 結論：CFC合算課税 ＋ 外税控除なし　＝　香港法人税（16.5%）＋日本法人税　の完全二重課税が確定
  </text>

  <!-- =============================================
       SECTION 4: 二つの書面要件の構造的矛盾
       ============================================= -->
  <rect x="30" y="820" width="260" height="24" rx="4" fill="url(#grad-section)"/>
  <text x="42" y="837" font-family="'Noto Sans JP', sans-serif" font-size="11" font-weight="bold" fill="white">03  二つの書面要件の構造的対比</text>

  <!-- Left column: 適用除外書面 -->
  <rect x="30" y="858" width="440" height="320" rx="10" fill="#1e2d3d" stroke="#2980b9" stroke-width="1.5" filter="url(#shadow-sm)"/>
  <rect x="30" y="858" width="440" height="36" rx="10" fill="url(#grad-blue)"/>
  <rect x="30" y="882" width="440" height="12" fill="url(#grad-blue)"/>
  <text x="250" y="882" font-family="'Noto Sans JP', sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">適用除外記載書面</text>
  <text x="250" y="916" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle" font-weight="bold">措法66条の6第７項（旧６項）</text>
  <text x="250" y="933" font-family="'Noto Sans JP', sans-serif" font-size="11" fill="#93c5fd" text-anchor="middle">措法68条の90第７項（連結法人）</text>

  <!-- Property rows -->
  <line x1="50" y1="948" x2="450" y2="948" stroke="#2c4f7c" stroke-width="1"/>
  <text x="50" y="965" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#64748b">法的性格</text>
  <text x="200" y="965" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#fca5a5" font-weight="bold">適用要件（効力要件）</text>
  <line x1="50" y1="978" x2="450" y2="978" stroke="#2c4f7c" stroke-width="1"/>
  <text x="50" y="995" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#64748b">添付先</text>
  <text x="200" y="995" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#e2e8f0">確定申告書</text>
  <line x1="50" y1="1008" x2="450" y2="1008" stroke="#2c4f7c" stroke-width="1"/>
  <text x="50" y="1025" font-family="'Noto Sans JP', sans-serif" font-size="10" fill="#64748b">制度目的</text>
